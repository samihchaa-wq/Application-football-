name: Temporary Petit Filet settings formatter
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/temporary_settings_formatter.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Print correctly formatted source files for review
        shell: bash
        run: |
          dart format lib/features/admin/presentation/club_settings_page.dart test/features/admin/presentation/club_settings_page_test.dart
          echo 'BEGIN_SETTINGS_FORMATTED'
          base64 -w0 lib/features/admin/presentation/club_settings_page.dart
          echo
          echo 'END_SETTINGS_FORMATTED'
          echo 'BEGIN_SETTINGS_TEST_FORMATTED'
          base64 -w0 test/features/admin/presentation/club_settings_page_test.dart
          echo
          echo 'END_SETTINGS_TEST_FORMATTED'

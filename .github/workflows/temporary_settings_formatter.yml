name: Temporary Petit Filet settings formatter
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/temporary_settings_formatter.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - shell: bash
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=write lib/features/admin/presentation/club_settings_page.dart
          echo 'BEGIN_SETTINGS_FORMATTED_V3'
          base64 -w0 lib/features/admin/presentation/club_settings_page.dart
          echo
          echo 'END_SETTINGS_FORMATTED_V3'

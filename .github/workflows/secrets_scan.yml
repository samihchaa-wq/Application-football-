name: Secrets scan

# Cherche des mots de passe ou des clés oubliés dans tout l'historique du
# dépôt, à chaque demande de fusion et à chaque envoi sur main. Le contrôle
# échoue dès qu'un secret apparaît. Les fausses alertes relues à la main sont
# listées dans .gitleaks.toml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.0'
      # Empreinte publiée par gitleaks (gitleaks_8.30.0_checksums.txt) : un
      # binaire modifié en route est refusé.
      GITLEAKS_SHA256: '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e'
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan git history
        shell: bash
        run: |
          set -euo pipefail
          # --redact : une valeur trouvée n'est jamais affichée dans le journal.
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner \
            --config .gitleaks.toml --exit-code 1 .

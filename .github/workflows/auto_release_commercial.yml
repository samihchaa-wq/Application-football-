name: Publication automatique Petit Filet

# Chaque nouveau commit sur main est publié seulement après validation.
# Le workflow est volontairement limité au projet commercial.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: petit-filet-auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_PROJECT_REF: jvxkhgdopslctpcjrhzw
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact de main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Vérifier branche, cible et configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$SUPABASE_PROJECT_REF" = 'jvxkhgdopslctpcjrhzw'
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo '::error::SUPABASE_ACCESS_TOKEN absent'; exit 1; }
          python3 tool/check_commercial_deploy.py
          python3 tool/check_commercial_migration_state.py

      - name: Attendre les contrôles du commit exact
        shell: bash
        run: |
          set -euo pipefail
          # Les contrôles peuvent démarrer après ce workflow. Attendre au plus 30 min.
          # Le workflow Supabase ne se déclenche que si ses chemins changent.
          git fetch --no-tags --deepen=1 origin main
          changed_files="$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" | grep -v '^supabase/production_migrations.lock$' || true)"
          workflows=(flutter_ci.yml)
          if printf '%s\n' "$changed_files" | grep -Eq '^(supabase/|\.github/workflows/supabase_business_tests\.yml$)'; then
            workflows+=(supabase_business_tests.yml)
          fi
          for workflow in "${workflows[@]}"; do
            found=""
            for attempt in $(seq 1 90); do
              found="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&per_page=30" --jq '.workflow_runs | first | .id // empty' 2>/dev/null || true)"
              if [[ "$found" =~ ^[0-9]+$ ]]; then break; fi
              sleep 20
            done
            [[ "$found" =~ ^[0-9]+$ ]] || { echo "::error::Contrôle $workflow introuvable"; exit 1; }
            gh run watch "$found" --exit-status --interval 10
          done

      - name: Vérifier que main n'a pas changé
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$latest" == "$GITHUB_SHA" ]] || {
            echo "::notice::Un nouveau commit existe ; la publication de $GITHUB_SHA est abandonnée au profit de la suivante."
            exit 1
          }

      - name: Sauvegarder la base commerciale et les fichiers Storage
        shell: bash
        run: |
          set -euo pipefail
          # Réutiliser le workflow de sauvegarde existant, ne pas écrire de logique
          # de backup non éprouvée dans cette automatisation.
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run production_backup.yml --ref main
          run=""
          for attempt in $(seq 1 30); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/production_backup.yml/runs?event=workflow_dispatch&per_page=5" | jq -r --arg started "$started_at" '.workflow_runs | map(select(.created_at >= $started)) | first | .id // empty' || true)"
            [[ "$run" =~ ^[0-9]+$ ]] && break
            sleep 5
          done
          [[ "$run" =~ ^[0-9]+$ ]] || { echo '::error::Sauvegarde introuvable'; exit 1; }
          gh run watch "$run" --exit-status --interval 10

      - name: Appliquer uniquement les migrations commerciales en attente
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/check_commercial_migration_state.py
          python3 tool/commercial_supabase_setup.py migrations
          python3 tool/check_commercial_migration_state.py

      - name: Vérifier le schéma commercial avant publication
        shell: bash
        run: python3 tool/check_kits_release_schema.py

      - name: Déclencher la publication Cloudflare du commit validé
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$latest" == "$GITHUB_SHA" ]] || {
            echo '::error::main a changé pendant la livraison ; ne pas publier un ancien commit.'
            exit 1
          }
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run deploy_cloudflare.yml --ref main -f target_sha="$GITHUB_SHA"
          run=""
          for attempt in $(seq 1 30); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy_cloudflare.yml/runs?event=workflow_dispatch&per_page=10" | jq -r --arg started "$started_at" '.workflow_runs | map(select(.created_at >= $started)) | first | .id // empty' || true)"
            [[ "$run" =~ ^[0-9]+$ ]] && break
            sleep 5
          done
          [[ "$run" =~ ^[0-9]+$ ]] || { echo '::error::Déploiement Cloudflare introuvable'; exit 1; }
          gh run watch "$run" --exit-status --interval 10
          echo "Publication automatique terminée pour $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

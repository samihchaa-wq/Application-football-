# Adapted from AS Grinta's Auth security guard for the Petit Filet
# multi-club application. Read-only checks: no Supabase credentials, no
# original project reference, no production Auth mutations.
name: Auth security guard

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/auth_security_guard.yml'
      - 'tool/check_auth_password_contract.py'
      - 'tool/tests/test_auth_password_contract.py'
      - 'lib/core/security/password_policy.dart'
      - 'supabase/functions/register-account/index.ts'
      - 'supabase/functions/register-account/password_policy.ts'
      - 'config/production.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth_security_guard.yml'
      - 'tool/check_auth_password_contract.py'
      - 'tool/tests/test_auth_password_contract.py'
      - 'lib/core/security/password_policy.dart'
      - 'supabase/functions/register-account/index.ts'
      - 'supabase/functions/register-account/password_policy.ts'
      - 'config/production.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-security-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-password-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test guard against policy drift and wrong project
        run: python3 -m unittest discover -s tool/tests -p 'test_auth_password_contract.py' -v

      - name: Verify commercial Flutter / Edge / Auth configuration contract
        run: python3 tool/check_auth_password_contract.py

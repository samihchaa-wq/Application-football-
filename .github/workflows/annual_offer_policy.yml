name: Annual team offer policy

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/annual_offer.ts'
      - 'supabase/tests/edge/annual_offer.test.mjs'
      - '.github/workflows/annual_offer_policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  annual-offer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test pricing without network, credentials or real payment
        run: node --test supabase/tests/edge/annual_offer.test.mjs

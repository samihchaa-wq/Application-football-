name: "QA - Auth/RLS/RPC/Storage isolation with real JWT"

# Two mock clubs in local Supabase only. Never production.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tool/qa/**'
      - '.github/workflows/tenant_http_isolation.yml'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenant-http-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tenant-http:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test safety guard
        run: python3 -m unittest discover -s tool/qa -p 'test_*.py' -v

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Start local Auth, PostgREST and Storage
        shell: bash
        run: |
          set -euo pipefail
          supabase start 2>&1 | tail -8

      - name: Real authenticated HTTP isolation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          supabase status -o env > "$RUNNER_TEMP/supabase-local.env"
          python3 tool/qa/tenant_http_smoke.py "$RUNNER_TEMP/supabase-local.env"
          rm -f "$RUNNER_TEMP/supabase-local.env"

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup || true

name: Lancer la sauvegarde commerciale vérifiée (ponctuel)

# Aucune migration et aucun déploiement : déclenche le workflow existant
# DB + Storage en lecture seule, vérifie son succès et son artefact chiffré.
# S'exécute une seule fois à l'ajout de ce fichier sur main.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/launch_verified_commercial_backup_20261114.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: launch-verified-commercial-backup-20261114
  cancel-in-progress: false

jobs:
  launch:
    name: Déclencher et contrôler Production backup
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Vérifier dépôt et branche commerciale
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "samihchaa-wq/Application-football-"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$GITHUB_SHA"

      - name: Exécuter une sauvegarde sans déployer ni migrer
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/production_backup.yml/runs?event=workflow_dispatch&per_page=10" --jq '[.workflow_runs[].id] | max // 0')"
          gh workflow run production_backup.yml --ref main
          backup_id=''
          for attempt in $(seq 1 35); do
            backup_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/production_backup.yml/runs?event=workflow_dispatch&per_page=50" --jq ".workflow_runs | map(select(.id > $before and .head_sha == \"$GITHUB_SHA\")) | sort_by(.id) | last | .id // empty")"
            test -n "$backup_id" && break
            sleep 5
          done
          test -n "$backup_id" || { echo '::error::Exécution de sauvegarde non identifiée.'; exit 1; }
          echo "Run sauvegarde : https://github.com/$GITHUB_REPOSITORY/actions/runs/$backup_id"
          gh run watch "$backup_id" --exit-status --interval 10
          artifact_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$backup_id/artifacts" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("commercial-complete-backup-")))] | length')"
          test "$artifact_count" -ge 1 || { echo '::error::Sauvegarde réussie sans archive chiffrée enregistrée.'; exit 1; }
          echo 'Archive chiffrée présente. ATTENTION : une restauration isolée réelle reste indispensable avant migration.'

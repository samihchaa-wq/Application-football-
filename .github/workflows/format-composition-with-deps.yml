name: Format composition with locked dependencies

on:
  push:
    branches:
      - feature/composition-kit-colors-phases-20261113
    paths:
      - '.github/workflows/format-composition-with-deps.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'samihchaa-wq/Application-football-' && github.ref == 'refs/heads/feature/composition-kit-colors-phases-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: Resolve exact locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD -- 'lib/**/*.dart' 'test/**/*.dart' > /tmp/kit-dart-files
          if test -s /tmp/kit-dart-files; then
            mapfile -t files < /tmp/kit-dart-files
            dart format "${files[@]}"
            git add -- "${files[@]}"
          fi

      - name: Commit only on feature branch
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(composition): format using locked Flutter dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

name: "Supabase commercial : mise en route"

# Lancement manuel uniquement (onglet Actions > ce workflow > Run workflow).
# Cible la SEULE base commerciale ; refuse AS Grinta et Carte soirée.
# Prérequis : secret GitHub SUPABASE_ACCESS_TOKEN (Supabase > Account >
# Access Tokens).
on:
  workflow_dispatch:
    inputs:
      migrations:
        description: 'Appliquer les migrations en attente'
        type: boolean
        default: true
      vault:
        description: 'Créer les secrets manquants du coffre (notifications)'
        type: boolean
        default: true
      functions:
        description: 'Déployer les fonctions serveur et leurs réglages'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: commercial-supabase-setup
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: jvxkhgdopslctpcjrhzw
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refuse any personal project
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = jvxkhgdopslctpcjrhzw
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo '::error::Ajouter le secret GitHub SUPABASE_ACCESS_TOKEN.'
            exit 1
          }
          python3 tool/check_commercial_deploy.py

      # Audit read-only : détecte les migrations absentes, inconnues
      # ou rétroactives AVANT tout appel qui écrit dans Supabase.
      - name: Verify production migration registry (read-only)
        shell: bash
        run: python3 tool/check_commercial_migration_state.py

      - name: Apply pending migrations
        if: inputs.migrations
        run: python3 tool/commercial_supabase_setup.py migrations

      - name: Create missing vault secrets
        if: inputs.vault
        run: |
          python3 -m pip install --quiet 'cryptography==44.0.0'
          python3 tool/commercial_supabase_setup.py vault

      - name: Setup Supabase CLI
        if: inputs.functions
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Deploy Edge Functions and their settings
        if: inputs.functions
        shell: bash
        env:
          # Adresse définitive (Cloudflare) si elle est réglée, sinon GitHub Pages.
          COMMERCIAL_APP_URL: ${{ vars.COMMERCIAL_APP_URL }}
          # Envoi des e-mails de compte (mot de passe oublié, confirmation
          # d'adresse) par l'API Brevo. Facultatif : sans ces deux réglages,
          # l'appli dit franchement que l'envoi n'est pas configuré.
          MAIL_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM_EMAIL: ${{ vars.MAIL_FROM_EMAIL }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
        run: |
          set -euo pipefail
          app_url="${COMMERCIAL_APP_URL:-$(jq -r .PUBLIC_APP_URL config/production.json)}"
          domain=$(jq -r .USERNAME_DOMAIN config/production.json)
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            "PUBLIC_APP_URL=$app_url" "USERNAME_DOMAIN=$domain"
          if [ -n "${MAIL_API_KEY:-}" ] && [ -n "${MAIL_FROM_EMAIL:-}" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
              "MAIL_API_KEY=$MAIL_API_KEY" "MAIL_FROM_EMAIL=$MAIL_FROM_EMAIL" \
              "MAIL_FROM_NAME=${MAIL_FROM_NAME:-Petit Filet}"
            echo "Envoi des e-mails : réglé (expéditeur $MAIL_FROM_EMAIL)."
          elif [ -n "${MAIL_API_KEY:-}" ] || [ -n "${MAIL_FROM_EMAIL:-}" ]; then
            echo '::error::Il faut à la fois le secret BREVO_API_KEY et la variable MAIL_FROM_EMAIL.'
            exit 1
          else
            echo '::warning::Envoi des e-mails non configuré (BREVO_API_KEY et MAIL_FROM_EMAIL absents) : « mot de passe oublié » ne marchera pas.'
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

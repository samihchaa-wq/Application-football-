name: Dump schema once

# Outil ponctuel : rejoue l'historique des migrations dans une base locale
# jetable, puis exporte la structure (sans aucune donnée de club) pour
# construire le socle propre de la version multi-clubs.

on:
  push:
    branches: ['tool/dump-schema']

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Start local database from migration history
        shell: bash
        run: |
          set -o pipefail
          supabase start 2>&1 | tee supabase-start.log

      - name: Dump structure and reference data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          supabase db dump --local --schema public,private -f out/schema_public_private.sql
          supabase db dump --local --schema storage -f out/schema_storage.sql || true
          supabase db dump --local --role-only -f out/roles.sql || true
          CONTAINER=$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -1)
          run_sql() { docker exec -i "$CONTAINER" psql -U postgres -d postgres -At -F $'\t' -c "$1"; }
          run_sql "select jobid, jobname, schedule, command from cron.job order by jobname" > out/cron_jobs.tsv || true
          run_sql "select row_to_json(b) from storage.buckets b order by id" > out/storage_buckets.jsonl || true
          run_sql "select schemaname, tablename, policyname, permissive, roles, cmd, qual, with_check from pg_policies where schemaname='storage' order by policyname" > out/storage_policies.tsv || true
          run_sql "select pubname, schemaname, tablename from pg_publication_tables order by 1,2,3" > out/publication_tables.tsv || true
          run_sql "select extname, extversion, extnamespace::regnamespace from pg_extension order by 1" > out/extensions.tsv || true
          run_sql "select n.nspname, c.relname, c.reltuples::bigint, (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I.%I', n.nspname, c.relname), false, true, '')))[1]::text from pg_class c join pg_namespace n on n.oid=c.relnamespace where c.relkind='r' and n.nspname in ('public','private') order by 1,2" > out/row_counts.tsv || true
          docker exec -i "$CONTAINER" pg_dump -U postgres -d postgres --data-only --column-inserts \
            -t public.badges -t private.app_feature_flags -t public.club_settings \
            -t public.feature_flag_change_signals -t public.shared_data_change_signals \
            > out/reference_data.sql || true
          run_sql "select nspname from pg_namespace order by 1" > out/schemas.tsv || true
          run_sql "select n.nspname, t.tgname, c.relname, pg_get_triggerdef(t.oid) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname in ('auth','storage','cron','net') order by 1,2" > out/foreign_schema_triggers.tsv || true
          ls -la out

      - name: Upload dump
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schema-dump
          path: |
            out
            supabase-start.log
          if-no-files-found: warn

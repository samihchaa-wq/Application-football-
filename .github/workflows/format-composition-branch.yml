name: Format composition branch after pub get

on:
  push:
    branches: [feature/composition-kit-colors-phases-20261113]
    paths: ['.github/workflows/format-composition-branch.yml']

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'samihchaa-wq/Application-football-' && github.ref == 'refs/heads/feature/composition-kit-colors-phases-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.9
      - name: Resolve locked pub package language version before formatting
        run: flutter pub get --enforce-lockfile
      - name: Format every tracked Dart file exactly as Flutter CI
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.dart')
          dart format --output=write "${files[@]}"
      - name: Commit only format changes to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- '*.dart'
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(composition): format using locked Dart language version'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

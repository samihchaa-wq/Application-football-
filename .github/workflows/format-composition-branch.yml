name: Format composition branch only

on:
  push:
    branches: [feature/composition-kit-colors-phases-20261113]
    paths:
      - '.github/workflows/format-composition-branch.yml'
      - 'lib/features/**'
      - 'test/features/**'

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'samihchaa-wq/Application-football-' && github.ref == 'refs/heads/feature/composition-kit-colors-phases-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this commercial feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: Format Dart without dependencies or live data
        run: |
          set -euo pipefail
          dart format lib/features/sports_management/presentation/admin_squad_plan_page.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart \
            lib/features/sports_management/presentation/match_lineup_page.dart \
            lib/features/sports_management/presentation/widgets/composition_kit_scope.dart \
            lib/features/sports_management/presentation/widgets/composition_pitch.dart \
            lib/features/sports_management/presentation/widgets/composition_presentation.dart \
            lib/features/sports_management/presentation/widgets/composition_presentation_elements.dart \
            lib/features/sports_management/presentation/widgets/internal_team_composition_view.dart \
            lib/features/sports_management/presentation/widgets/internal_team_composition_widgets.dart \
            lib/features/sports_management/presentation/widgets/player_composition_video.dart \
            lib/features/match_live/presentation/match_live_pre_kickoff_page.dart \
            lib/features/match_live/presentation/match_live_running_page.dart \
            lib/features/match_live/presentation/match_live_running_widgets.dart \
            lib/features/matches/presentation/match_details_page.dart \
            test/features/sports_management/presentation/widgets/composition_kit_scope_test.dart

      - name: Commit formatting only on the feature branch
        run: |
          set -euo pipefail
          git add lib test
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(composition): apply canonical Dart formatter'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

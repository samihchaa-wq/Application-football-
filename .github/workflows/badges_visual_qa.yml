name: Aperçu visuel des 14 badges Petit Filet

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/images/badge_backgrounds/**'
      - 'lib/features/badges/**'
      - 'test/features/badges/**'
      - 'scripts/render_badge_gallery.py'
      - '.github/workflows/badges_visual_qa.yml'

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install image preview dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0

      - name: Render gallery from packaged assets
        run: python3 scripts/render_badge_gallery.py

      - name: Upload gallery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: badges-14-fonds-gallery
          path: badge-previews/*.png
          if-no-files-found: warn
